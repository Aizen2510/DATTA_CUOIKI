services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./minio_storage:/data
    command: server /data --console-address ":9001"

  postgres-dw:
    image: postgres:15-alpine
    container_name: postgres_dw
    environment:
      POSTGRES_USER: ${DW_USER:?Set DW_USER in .env}
      POSTGRES_PASSWORD: ${DW_PASSWORD:?Set DW_PASSWORD in .env}
      POSTGRES_DB: ${DW_DATABASE:-dw_movies}
    ports:
      - "5434:5432"
    volumes:
      - ./dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_USER} -d ${DW_DATABASE:-dw_movies}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:15-alpine
    container_name: airflow_metadata_db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?Set AIRFLOW_ADMIN_USER in .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      PROJECT_DIR: /opt/airflow/project
      STAGING_DIR: /opt/airflow/project/staging
      DATA_DIR: /opt/airflow/project/raw_data
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: raw-datalake
      DW_URL: postgresql+psycopg2://${DW_USER}:${DW_PASSWORD}@postgres-dw:5432/${DW_DATABASE:-dw_movies}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && (airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Data --lastname Engineer --role Admin --email admin@example.local || airflow users list | grep -Fq "$${AIRFLOW_ADMIN_USER}")

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      postgres-dw:
        condition: service_healthy
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      postgres-dw:
        condition: service_healthy
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

volumes:
  airflow_db_data:
